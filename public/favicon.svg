<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fundo Escuro Moderno -->
  <rect width="100" height="100" rx="20" fill="#121212"/>
  
  <!-- Estrela de Thelema (Hexagrama Unicursal) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Traçado do Hexagrama Unicursal -->
    <path d="M 50,8 L 88,74 L 50,50 L 12,26 L 88,26 L 50,50 L 12,74 L 50,92 L 50,50 Z" />
    <!-- Vértice inferior conectando ao topo -->
    <path d="M 50,8 L 12,74 M 50,8 L 88,74 M 50,92 L 12,26 M 50,92 L 88,26" opacity="0.3" stroke-width="1.5" />
    
    <!-- Flor/Rosa Central de 5 pétalas de Thelema -->
    <circle cx="50" cy="50" r="6" fill="#121212" stroke="#ffffff" stroke-width="2"/>
    <circle cx="50" cy="45" r="2.5" fill="#ffffff" stroke="none"/>
    <circle cx="54.7" cy="48.5" r="2.5" fill="#ffffff" stroke="none"/>
    <circle cx="52.9" cy="54" r="2.5" fill="#ffffff" stroke="none"/>
    <circle cx="47.1" cy="54" r="2.5" fill="#ffffff" stroke="none"/>
    <circle cx="45.3" cy="48.5" r="2.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
